

name: Terraform Cleanup

on:
  workflow_dispatch:  # Allows manual trigger from GitHub UI
 

jobs:
  terraform:
    name: 'Post Apply Cleanup'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: 'eu-north-1'

    steps:
    - name: 'Checkout GitHub repository'
      uses: actions/checkout@v3  # Use the latest checkout action

    - name: 'Configure AWS credentials'
      uses: aws-actions/configure-aws-credentials@v2  # Updated to v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 'Set up Terraform'
      uses: hashicorp/setup-terraform@v2  # Updated to v2 for the latest Terraform version
      with:
        terraform_version: latest  # Using 'latest' to always get the latest version of Terraform

    - name: 'Terraform Init'
      run: terraform init

    - name: 'Terraform Plan Destroy'
      run: terraform plan -destroy -out=tfplan-destroy

    - name: 'Terraform Apply Destroy'
      run: terraform apply -auto-approve tfplan-destroy
