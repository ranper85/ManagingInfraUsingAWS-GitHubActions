
name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: 'Terraform Deploy'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: 'us-east-1'

    steps:
    - name: 'Checkout GitHub repository'
      uses: actions/checkout@v3  # Use the latest checkout action

    - name: 'Configure AWS credentials'
      uses: aws-actions/configure-aws-credentials@v2  # Updated to v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 'Set up Terraform'
      uses: hashicorp/setup-terraform@v2  # Updated to v2 for the latest Terraform version
      with:
        terraform_version: latest  # Using 'latest' to always get the latest version of Terraform

    - name: 'Terraform Init'
      run: terraform init

    - name: 'Terraform Format'
      run: terraform fmt -check -diff  # Checks formatting and outputs diffs if any

    - name: 'Terraform Validate'
      run: terraform validate

    - name: 'Terraform Plan'
      run: terraform plan -out=tfplan

    - name: 'Terraform Apply'
      if: github.ref == 'refs/heads/main'  # Ensures apply is only triggered on the main branch
      run: terraform apply -auto-approve tfplan

